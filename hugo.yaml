      url: /archives/
      weight: 20

    - identifier: categories
      name: 分类
      url: /categories/
      weight: 30

    - identifier: tags
      name: 标签
      url: /tags/
      weight: 40

    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

    - identifier: about
      name: 关于
      url: /about/
      weight: 60

outputs:
  home:
    - HTML
    - RSS
    - JSON